version: "3.9"

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - my-network
    env_file:
      - .env.local
    restart: always

  oracle-db:
    image: gvenzl/oracle-xe
    container_name: oracle-db
    environment:
      - ORACLE_PASSWORD=StrongPass123
    ports:
      - "1521:1521" # SQL*Net
      - "5500:5500" # Enterprise Manager
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - my-network
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - oracle-db
    environment:
      - NODE_ENV=production
    networks:
      - my-network
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - my-network
    restart: always

volumes:
  mongo_data:
  oracle_data:

networks:
  my-network:
    driver: bridge


